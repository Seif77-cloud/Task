<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظومة متابعة الطلاب</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container py-4">
  <div class="text-center mb-4">
    <h1>📚 منظومة متابعة الطلاب</h1>
    <p class="text-muted">سجل درجات الطلاب وتابع لجنة الرأفة بسهولة</p>
  </div>
  <div class="card p-4 shadow-sm">
    <h5 class="mb-3">بيانات الطالب الجديد</h5>
    <div class="mb-3">
      <label class="form-label">الاسم بالكامل</label>
      <input type="text" id="txtName" class="form-control" placeholder="مثال: محمد أحمد">
    </div>
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label">العربي</label><input type="number" id="txtSub1" class="form-control" placeholder="من 0 لـ 100"></div>
      <div class="col-md-4"><label class="form-label">الرياضيات</label><input type="number" id="txtSub2" class="form-control" placeholder="من 0 لـ 100"></div>
      <div class="col-md-4"><label class="form-label">الإنجليزي</label><input type="number" id="txtSub3" class="form-control" placeholder="من 0 لـ 100"></div>
    </div>
    <div class="mt-3 mb-3">
      <label class="form-label">نسبة الحضور</label>
      <input type="number" id="txtAttend" class="form-control" placeholder="مثال: 85">
    </div>
    <div id="msgError" class="alert alert-danger d-none"></div>
    <div class="row g-2">
      <div class="col-6"><button id="btnSave" class="btn btn-success w-100">حفظ الطالب +</button></div>
      <div class="col-6"><button id="btnRaafa" class="btn btn-dark w-100">تشغيل لجنة الرأفة</button></div>
    </div>
  </div>
  <div class="card p-4 mt-4 shadow-sm">
    <div class="d-flex justify-content-between align-items-center">
      <h5>الطلاب المسجلين</h5><span id="countBadge" class="badge bg-primary">0 طالب</span>
    </div><hr>
    <div id="boxStudents">لسه مفيش طلاب متسجلين.</div>
  </div>
  <div class="card p-4 mt-4 shadow-sm">
    <h5>نتيجة لجنة الرأفة</h5><hr>
    <div id="boxReport">دوس على تشغيل لجنة الرأفة عشان تشوف التقرير.</div>
  </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
